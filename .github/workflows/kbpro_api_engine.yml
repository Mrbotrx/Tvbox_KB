name: KBPRO API Playlist Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: kbpro-api-engine
  cancel-in-progress: true

jobs:
  generate-playlist:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install requirements
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.5
          pip install beautifulsoup4==4.14.2
          pip install pyzipper==0.3.6

      # 4. Extract Main ZIP
      - name: Extract Main ZIP
        env:
          ZIP_PASSWORD: ${{ secrets.PLAYLIST_ZIP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          import pyzipper
          from pathlib import Path

          source = Path("kbpro_api_engine.zip")
          output = Path("kbpro_extracted")

          if not source.exists():
              raise SystemExit("ERROR: Main ZIP not found!")

          password = os.environ.get("ZIP_PASSWORD", "")

          if not password:
              raise SystemExit("ERROR: ZIP password secret missing!")

          output.mkdir(exist_ok=True)

          try:
              with pyzipper.AESZipFile(source, "r") as z:
                  z.setpassword(password.encode())
                  z.extractall(output)

          except Exception as aes_error:
              print("AES extraction failed, trying standard ZIP...")
              try:
                  with zipfile.ZipFile(source, "r") as z:
                      z.extractall(
                          output,
                          pwd=password.encode()
                      )
              except Exception as error:
                  raise SystemExit(
                      f"ZIP extraction failed: {error}"
                  )

          print("ZIP extracted successfully!")

          for file in output.rglob("*"):
              if file.is_file():
                  print(file)
          PY

      # 5. Find Python Script
      - name: Locate Main Python Script
        id: locate
        run: |
          echo "Searching Python files..."

          SCRIPT=$(find kbpro_extracted \
            -type f \
            -name "kbpro_api_engine.py" \
            | head -n 1)

          if [ -z "$SCRIPT" ]; then
            SCRIPT=$(find kbpro_extracted \
              -type f \
              -name "*.py" \
              | head -n 1)
          fi

          if [ -z "$SCRIPT" ]; then
            echo "ERROR: No Python script found inside ZIP!"
            exit 1
          fi

          echo "SCRIPT=$SCRIPT" >> "$GITHUB_OUTPUT"

          echo "Python Script Found: $SCRIPT"

      # 6. Run Main Script
      - name: Generate Playlist and Locked ZIP
        env:
          PLAYLIST_ZIP_PASSWORD: ${{ secrets.PLAYLIST_ZIP_PASSWORD }}
        run: |
          python "${{ steps.locate.outputs.SCRIPT }}"

      # 7. Verify Files
      - name: Verify Generated Files
        run: |
          if [ ! -s KBPRO_API_CHANNELS.m3u ]; then
            echo "Playlist missing!"
            exit 1
          fi

          if [ ! -s KBPRO_API_CHANNELS_LOCKED.zip ]; then
            echo "Locked ZIP missing!"
            exit 1
          fi

          echo "All files generated successfully!"

      # 8. Push to GitHub
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add KBPRO_API_CHANNELS.m3u
          git add KBPRO_API_CHANNELS_LOCKED.zip

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update KBPRO API Playlist"
            git push
          fi
