name: Website Auto Update

on:
workflow_dispatch:

schedule:
- cron: "*/30 * * * *"

permissions:
contents: write

concurrency:
group: website-auto-update
cancel-in-progress: false

jobs:
update:
name: Update Website Playlist
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Prepare Directory
    run: |
      mkdir -p public

  - name: Run Website Scanner
    run: |
      python -u main.py

  - name: Validate Playlist
    id: validate
    run: |
      if [ -s public/ash-tv.m3u ] && \
         head -n 1 public/ash-tv.m3u | grep -q '^#EXTM3U'; then
        echo "valid=true" >> "$GITHUB_OUTPUT"
        echo "Valid playlist found."
      else
        echo "valid=false" >> "$GITHUB_OUTPUT"
        echo "No valid playlist found."
        echo "Previous playlist will not be committed or deleted."
      fi

  - name: Commit Playlist
    if: steps.validate.outputs.valid == 'true'
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -f public/ash-tv.m3u

      if git diff --cached --quiet; then
        echo "No changes detected."
      else
        git commit -m "Automated playlist update"
        git push origin "HEAD:${GITHUB_REF_NAME}"
      fi

  - name: Final Report
    if: always()
    run: |
      echo "## Website Auto Update" >> "$GITHUB_STEP_SUMMARY"
      echo "Workflow execution finished." >> "$GITHUB_STEP_SUMMARY"
