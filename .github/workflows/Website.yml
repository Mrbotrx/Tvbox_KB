name: ASH TV Playlist Update

on:
workflow_dispatch:

schedule:
- cron: "*/30 * * * *"

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest
timeout-minutes: 5

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Requirements
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Create Public Directory
    run: |
      mkdir -p public

  - name: Run Playlist Generator
    run: |
      python main.py

  - name: Commit Playlist Changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      if [ ! -f "public/ash-tv.m3u" ]; then
        echo "Playlist not found."
        echo "Skipping commit safely."
        exit 0
      fi

      git add -f public/ash-tv.m3u

      if git diff --cached --quiet; then
        echo "No changes detected."
      else
        git commit -m "Update ASH TV playlist"
        git push
      fi

  - name: Workflow Summary
    if: always()
    run: |
      echo "## ASH TV Playlist Update" >> $GITHUB_STEP_SUMMARY

      if [ -f public/ash-tv.m3u ]; then
        echo "Playlist file exists." >> $GITHUB_STEP_SUMMARY
      else
        echo "No playlist file available." >> $GITHUB_STEP_SUMMARY
      fi
