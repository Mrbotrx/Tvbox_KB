name: BD X WEBSIE Playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Generator
        run: |
          python main.py

      - name: Verify Playlist
        run: |
          if [ ! -s playlist.m3u ]; then
            echo "ERROR: playlist.m3u missing or empty"
            exit 1
          fi

          if ! head -n 1 playlist.m3u | grep -q "#EXTM3U"; then
            echo "ERROR: Invalid M3U playlist"
            exit 1
          fi

          echo "Playlist generated successfully"
          ls -lh playlist.m3u

      - name: Commit Changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then

            echo "No changes found"

          else

            git commit -m "Auto update playlist"

            git push

          fi
