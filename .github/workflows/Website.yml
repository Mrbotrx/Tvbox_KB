name: ASH TV Playlist Update

on:
workflow_dispatch:

schedule:
- cron: "*/30 * * * *"

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest
timeout-minutes: 5

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Requirements
    run: |
      pip install -r requirements.txt

  - name: Run Playlist Generator
    run: |
      python main.py

  - name: Commit Playlist
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      mkdir -p public

      if [ -f public/ash-tv.m3u ]; then
        git add -f public/ash-tv.m3u
      else
        echo "Playlist does not exist. Nothing to commit."
        exit 0
      fi

      if git diff --cached --quiet; then
        echo "No playlist changes."
      else
        git commit -m "Update ASH TV playlist"
        git push
      fi
