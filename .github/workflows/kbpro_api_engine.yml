name: KBPRO API Playlist Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */3 * * *"

  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/kbpro_api_engine.yml"

permissions:
  contents: write

concurrency:
  group: kbpro-api-engine
  cancel-in-progress: true

jobs:
  generate-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Locate Python Script
        id: locate
        run: |
          echo "Searching Python files..."

          find . -type f -name "kbpro_api_engine.py"

          SCRIPT=$(find . -type f -name "kbpro_api_engine.py" | head -n 1)

          if [ -z "$SCRIPT" ]; then
            echo "ERROR: kbpro_api_engine.py not found!"
            exit 1
          fi

          echo "SCRIPT=$SCRIPT" >> "$GITHUB_OUTPUT"

          echo "Found: $SCRIPT"

      - name: Generate Playlist and Locked ZIP
        env:
          PLAYLIST_ZIP_PASSWORD: ${{ secrets.PLAYLIST_ZIP_PASSWORD }}
        run: |
          python "${{ steps.locate.outputs.SCRIPT }}"

      - name: Verify Generated Files
        run: |
          test -s KBPRO_API_CHANNELS.m3u
          test -s KBPRO_API_CHANNELS_LOCKED.zip

          echo "Playlist and ZIP generated successfully."

      - name: Commit Updated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add KBPRO_API_CHANNELS.m3u
          git add KBPRO_API_CHANNELS_LOCKED.zip

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update KBPRO API Playlist and ZIP"
            git push
          fi
