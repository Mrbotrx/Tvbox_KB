name: Website Playlist Update

on:
workflow_dispatch:

schedule:
- cron: "*/30 * * * *"

permissions:
contents: write

concurrency:
group: website-playlist-update
cancel-in-progress: false

jobs:
update:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Prepare Directory
    run: |
      mkdir -p public

  - name: Run Website Scanner
    run: |
      python main.py

  - name: Check Playlist
    id: playlist
    run: |
      if [ -s public/ash-tv.m3u ]; then
        echo "exists=true" >> "$GITHUB_OUTPUT"
        echo "Playlist found."
      else
        echo "exists=false" >> "$GITHUB_OUTPUT"
        echo "Playlist missing or empty."
      fi

  - name: Commit Changes
    if: steps.playlist.outputs.exists == 'true'
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -f public/ash-tv.m3u

      if git diff --cached --quiet; then
        echo "No changes detected."
      else
        git commit -m "Automated website playlist update"
        git push origin HEAD:${GITHUB_REF_NAME}
      fi

  - name: Summary
    if: always()
    run: |
      echo "## Website Playlist Update" >> "$GITHUB_STEP_SUMMARY"
      echo "- Workflow completed." >> "$GITHUB_STEP_SUMMARY"
      echo "- Previous playlist is preserved when no new streams are found." >> "$GITHUB_STEP_SUMMARY"
